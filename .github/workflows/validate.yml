name: Validate and package SparkWorld
on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build the optional Windows package
        type: boolean
        default: false
  push:
    branches: [codex/spark-release, main]
permissions:
  contents: read
jobs:
  browser-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test document state, layer dependencies and touch gestures
        run: node --test tests/*.test.mjs
      - uses: actions/setup-dotnet@v5
        id: dotnet
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache/restore@v4
        id: browser-cache
        with:
          path: .out/browser
          key: browser-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('cad/*.cs', 'cad/*.csproj', 'cad-browser/*.cs', 'cad-browser/*.csproj') }}
      - name: Install browser build tools
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools --skip-manifest-update
      - name: Build native command-line engine
        run: dotnet build cad/CadBridge.csproj -c Release -o .out/cad
      - name: Test native source edits and round trips
        run: dotnet run --project cad-tests/SparkWorld.CadTests.csproj -c Release -- --fixture .out/cad-fixture.dwg
      - uses: actions/upload-artifact@v4
        with:
          name: cad-fixtures
          path: |
            .out/cad-fixture.dwg
            .out/layer-fixture.dwg
          retention-days: 3
      - name: Build browser CAD engine
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: dotnet publish cad-browser/SparkWorld.CadBrowser.csproj -c Release -o .out/browser
      - uses: actions/cache/save@v4
        if: steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: .out/browser
          key: browser-${{ runner.os }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('cad/*.cs', 'cad/*.csproj', 'cad-browser/*.cs', 'cad-browser/*.csproj') }}
      - name: Report output sizes
        run: du -sh .out/browser && find .out/browser -maxdepth 3 -type f | head -40
      - name: Prepare the locked SparkWorld viewport component
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/prepare-locked-cad-host.py --output .out/site/app
      - name: Assemble the web release
        run: |
          mkdir -p .out/site/engine
          python3 tools/prepare-web-release.py --output .out/site --commit "$GITHUB_SHA"
          cp -a .out/browser/wwwroot/. .out/site/engine/
          find .out/site/engine -type f \( -name '*.br' -o -name '*.gz' -o -name '*.pdb' \) -delete
          cp THIRD_PARTY_NOTICES.md LICENSE .out/site/
          cp -a licenses .out/site/
          touch .out/site/.nojekyll
      - name: Install pinned browser verification tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.out/qa-browsers
        run: |
          npm install --prefix .out/qa --no-audit --no-fund playwright@1.62.1
          .out/qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify electrical mobile library, layers and selection
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.out/qa-browsers
        run: node tests/electrical-mobile.cjs
      - name: Verify the assembled web app under /spark/
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.out/qa-browsers
        run: node tests/unified-web-release.cjs
      - name: Verify configurable layouts and mobile UI settings
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.out/qa-browsers
        run: node tests/run-ui-layout-lab.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-verification
          path: .out/test-results
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: verified-web-site
          path: .out/site
          include-hidden-files: true
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: browser-engine
          path: .out/browser
          retention-days: 3
  desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Create application icon
        shell: pwsh
        run: ./tools/New-Icon.ps1 -OutputPath "$pwd/.out/SparkWorld.ico"
      - name: Build Windows application
        shell: pwsh
        run: dotnet build desktop/SparkWorld.Desktop.csproj -c Release -o .out/windows -p:SparkIcon="$pwd/.out/SparkWorld.ico"
      - name: Include the matching interface
        shell: pwsh
        run: Copy-Item -LiteralPath web -Destination .out/windows/web -Recurse
      - name: Include component notices
        shell: pwsh
        run: |
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination .out/windows/THIRD_PARTY_NOTICES.md
          Copy-Item -LiteralPath licenses -Destination .out/windows/licenses -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: .out/windows
          retention-days: 3
  pages:
    if: github.ref == 'refs/heads/main'
    needs: [browser-engine]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-web-site
          path: .out/site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .out/site
      - name: Publish verified site
        id: deployment
        uses: actions/deploy-pages@v4
