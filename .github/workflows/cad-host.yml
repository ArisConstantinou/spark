name: Build and verify SparkWorld CAD viewport host
on:
  workflow_dispatch:
    inputs:
      trace_open:
        description: Build a diagnostic CAD component with open phase markers
        type: boolean
        default: false
  push:
    branches: [codex/cad-viewport-host]
    paths:
      - '.github/workflows/cad-host.yml'
      - 'tools/prepare-cad-host.py'
      - 'tools/cad-symbol-operation.rs'
      - 'tools/cad-browser-storage.rs'
      - 'tools/finalize-cad-host.py'
      - 'tools/prepare-cad-codec.py'
      - 'tools/prepare-locked-cad-host.py'
      - 'tools/cad-host-frame-baseline.json'
      - 'cad-tests/**'
      - 'web/**'
      - 'tests/cad-*.cjs'
permissions:
  contents: read
  actions: read
concurrency:
  group: sparkworld-cad-host
  cancel-in-progress: false
jobs:
  web-host:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_TARGET_DIR: ${{ github.workspace }}/.out/cad-target
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.out/qa-browsers
      SPARK_HOSTED_RENDERER: '1'
      SPARK_TEST_DPR: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the reviewed CAD source
        uses: actions/checkout@v4
        with:
          repository: HakanSeven12/OpenCADStudio
          ref: 0e77cae652271d08c7619238e619f9b6668ae17c
          path: .out/cad-source
          persist-credentials: false
      - name: Apply the bounded viewport presentation change
        run: |
          python3 tools/prepare-cad-host.py .out/cad-source
          sh -n .out/cad-source/scripts/build-web-worker.sh
      - name: Add native open diagnostics
        if: inputs.trace_open
        run: python3 tools/prepare-cad-open-trace.py .out/cad-source
      - name: Checkout the existing pinned codec source
        uses: actions/checkout@v4
        with:
          repository: hakanaktt/acadrust
          ref: 53e6420c4df4d207409798c2719d32fc6cf2811d
          path: .out/cad-codec-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate the authored public CAD fixtures from source
        run: |
          dotnet run --project cad-tests/SparkWorld.CadTests.csproj -c Release -- --fixture .out/cad-fixture.dwg
          dotnet run --no-build --project cad-tests/SparkWorld.CadTests.csproj -c Release -- --mtext-fixture .out/mtext-frame-fixture.dxf
          dotnet run --no-build --project cad-tests/SparkWorld.CadTests.csproj -c Release -- --mtext-fixture .out/mtext-frame-reader-fixture.dwg
      - name: Retain only the authored regression inputs
        uses: actions/upload-artifact@v4
        with:
          name: mtext-authored-fixtures
          path: .out/mtext-frame-*.d*
          include-hidden-files: true
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing pinned browser verifier
        run: |
          npm install --prefix .out/qa --no-audit --no-fund playwright@1.62.1
          .out/qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Reproduce regressions on the pinned pre-fix component
        run: |
          python3 tools/prepare-locked-cad-host.py --frame-baseline --output .out/site/app
          cp -a web/. .out/site/
          node tests/cad-mtext-codec.cjs --expect-frame-failure
      - name: Apply the pinned MTEXT wire-format correction
        run: python3 tools/prepare-cad-codec.py .out/cad-source .out/cad-codec-source
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .out/cad-source -> ../cad-target
          key: sparkworld-cad-host-0e77cae
          cache-on-failure: true
      - name: Install the pinned web builder
        uses: taiki-e/install-action@v2
        with:
          tool: trunk@0.22.1
      - name: Read the locked wasm-bindgen version
        id: bindgen
        run: |
          version=$(sed -n '/name = "wasm-bindgen"/{n;s/version = "\(.*\)"/\1/p;q;}' .out/cad-source/Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Record build tools and available space
        run: |
          rustc --version
          trunk --version
          wasm-bindgen --version
          df -h .
      - name: Compile only the web component
        working-directory: .out/cad-source
        run: trunk build --locked --release --public-url ./ --dist "$GITHUB_WORKSPACE/.out/site/app" --html-output index.html web-app.html
      - name: Prepare the owned web host
        run: |
          python3 tools/finalize-cad-host.py .out/cad-source .out/site/app --codec-source .out/cad-codec-source
          cp -a web/. .out/site/
          cp THIRD_PARTY_NOTICES.md LICENSE .out/site/
          cp -a licenses .out/site/
          du -sh .out/cad-target .out/site/app
      - name: Retain the compiled component for bounded diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.trace_open && 'cad-open-trace' || 'compiled-cad-host' }}
          path: .out/site/app
          include-hidden-files: true
          retention-days: 3
      - name: Verify framed MTEXT in DWG and DXF with the independent reader
        run: node tests/cad-mtext-codec.cjs
      - name: Verify the actual viewport host and custom tools
        run: node tests/cad-host-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-host-verification
          path: .out/test-results
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: '!inputs.trace_open'
        with:
          name: verified-cad-host
          path: .out/site
          include-hidden-files: true
          retention-days: 3
